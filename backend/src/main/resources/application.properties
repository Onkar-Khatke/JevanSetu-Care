spring.application.name=jeevansetu-backend
server.port=${PORT:8080}

# MongoDB Configuration (Environment variable override with local fallback)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/jeevansetu}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration (Stateless auth with 24h expiration)
jeevansetu.jwt.secret=${JWT_SECRET:9a3f2c4e8b1d7a6f5e0c3b8a2d1e4f7a9b0c2d3e4f5a6b7c8d9e0f1a2b3c4d5e}
jeevansetu.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# IoT Ingestion Security Key (Shared header X-Device-Key)
jeevansetu.iot.device-key=${DEVICE_API_KEY:jeevansetu-iot-secure-dev-key-2026}

# AI Health Assistant Configuration
# Default: safe-fallback (Rule-based clinical triage, emergency sign detector, no external leak)
# Alternatives: "gemini", "openai", "http-service"
jeevansetu.ai.provider=${AI_PROVIDER:safe-fallback}
jeevansetu.ai.api-key=${AI_API_KEY:}
jeevansetu.ai.service-url=${AI_SERVICE_URL:http://localhost:5000}

# Logging configuration
logging.level.com.jeevanSetuBackend.backend=INFO
logging.level.org.springframework.security=WARN
